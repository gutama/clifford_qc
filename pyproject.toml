[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clifford-qc"
dynamic = ["version"]
description = "Operator-centric quantum computing in Cl(2n,C) using sparse Pauli-word multivectors"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Ginanjar Utama", email = "ginanjar.utama@gmail.com"}]
keywords = ["quantum computing", "clifford algebra", "geometric algebra", "pauli", "jordan-wigner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/gutama/clifford_qc"
Issues = "https://github.com/gutama/clifford_qc/issues"

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
research = ["scipy>=1.11"]
stim = ["stim>=1.13"]  # >=1.13 for the SPP (sqrt-of-Pauli-product) gate
openfermion = ["openfermion>=1.6"]
pytket = ["pytket>=1.30"]
pennylane = ["pennylane>=0.38"]
bridges = ["clifford-qc[stim,openfermion,pytket,pennylane]"]

[tool.setuptools.dynamic]
version = {attr = "clifford_qc.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["clifford_qc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
