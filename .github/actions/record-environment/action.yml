name: Record environment
description: >-
  Install the project under a reproducible record environment. By default all
  committed records must agree; reference-record selects one record's own stamp
  for a record-local gate while global consistency is checked separately.

inputs:
  reference-record:
    description: >-
      Optional basename under benchmarks/reference_results. When set, derive
      and verify the environment from only that record.
    required: false
    default: ""
  execution-declaration:
    description: >-
      Optional frozen declaration with execution_environment. When supplied,
      its exact Python/NumPy/SciPy/thread contract takes precedence over the
      record-local environment, for full-seed replay only.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read the interpreter the selected records were produced under
      id: interpreter
      shell: bash
      env:
        RECORD_ENV_REFERENCE: ${{ inputs.reference-record }}
        RECORD_EXECUTION_DECLARATION: ${{ inputs.execution-declaration }}
      # The runner's own Python is enough here: the script is standard library
      # only, precisely so it can speak before anything has been installed.
      run: |
        args=()
        if [[ -n "$RECORD_ENV_REFERENCE" ]]; then
          args+=(--record "$RECORD_ENV_REFERENCE")
        fi
        if [[ -n "$RECORD_EXECUTION_DECLARATION" ]]; then
          version="$(python3 -m benchmarks.ci_gates --environment "$RECORD_EXECUTION_DECLARATION" --emit python)"
        else
          version="$(python3 benchmarks/check_record_environment.py --python "${args[@]}")"
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.interpreter.outputs.version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Derive the library pin from the selected records
      shell: bash
      env:
        RECORD_ENV_REFERENCE: ${{ inputs.reference-record }}
        RECORD_EXECUTION_DECLARATION: ${{ inputs.execution-declaration }}
      run: |
        args=()
        if [[ -n "$RECORD_ENV_REFERENCE" ]]; then
          args+=(--record "$RECORD_ENV_REFERENCE")
        fi
        if [[ -n "$RECORD_EXECUTION_DECLARATION" ]]; then
          python -m benchmarks.ci_gates --environment "$RECORD_EXECUTION_DECLARATION" --emit constraints > constraints.txt
        else
          python benchmarks/check_record_environment.py --constraints "${args[@]}" > constraints.txt
        fi
        cat constraints.txt

    - name: Install
      shell: bash
      # stim is not a test dependency, but three test files and the hierarchy
      # records need it; without it they would skip quietly rather than fail.
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[test,research,stim]' -c constraints.txt

    - name: Verify the installed environment against the selected records
      shell: bash
      env:
        RECORD_ENV_REFERENCE: ${{ inputs.reference-record }}
        RECORD_EXECUTION_DECLARATION: ${{ inputs.execution-declaration }}
      run: |
        args=()
        if [[ -n "$RECORD_ENV_REFERENCE" ]]; then
          args+=(--record "$RECORD_ENV_REFERENCE")
        fi
        if [[ -n "$RECORD_EXECUTION_DECLARATION" ]]; then
          python -m benchmarks.ci_gates --environment "$RECORD_EXECUTION_DECLARATION" --emit verify
        else
          python benchmarks/check_record_environment.py "${args[@]}"
        fi
