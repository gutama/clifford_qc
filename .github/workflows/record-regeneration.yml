name: Scheduled record regeneration

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: spin-small
            command: python benchmarks/run_benchmark.py --config benchmarks/configs/spin_small.json
            record: spin_small.jsonl
          - name: spin-headline
            command: python benchmarks/run_benchmark.py --config benchmarks/configs/spin_headline_n4.json
            record: spin_headline_n4.jsonl
          - name: spin-n6
            command: python benchmarks/run_benchmark.py --config benchmarks/configs/spin_n6.json
            record: spin_n6.jsonl
          - name: acase-ladder
            command: python benchmarks/run_acase_ladder.py --config benchmarks/configs/acase_ladder.json
            record: acase_ladder.jsonl
          - name: stabilizer-seeding
            command: python benchmarks/run_stabilizer_seeding.py
            record: stabilizer_seeding.jsonl
          - name: chemistry
            command: python benchmarks/run_chemistry.py --seeds 3
            record: chemistry.jsonl
          - name: orbital-basis
            command: python benchmarks/run_orbital_basis.py
            record: orbital_basis.json
          - name: configuration-packets
            command: python benchmarks/run_configuration_packets.py
            record: configuration_packets.json
          - name: fcidump-h4
            command: python benchmarks/run_fcidump_h4.py
            record: fcidump_h4.json
          - name: warm-start-h4
            command: python benchmarks/run_warm_start.py
            record: warm_start_h4.json
          - name: matched-h4
            command: python benchmarks/run_matched_h4.py
            record: matched_h4.json
          - name: krylov-width
            command: python benchmarks/run_krylov_width.py
            record: krylov_width.json
          - name: calibration
            command: python benchmarks/run_calibration.py --seeds 200
            record: calibration.jsonl
          - name: baselines
            command: python benchmarks/run_baselines.py --seeds 15
            record: baselines.jsonl
          - name: chemistry-repair
            command: python benchmarks/run_chemistry_repair.py
            record: chemistry_repair.jsonl
          - name: certified-trajectories
            command: python benchmarks/run_certified_trajectories.py
            record: certified_trajectories.jsonl
          - name: calibration-eps-best
            command: python benchmarks/run_calibration_eps_best.py --seeds 60
            record: calibration_eps_best.jsonl
          - name: ceiling-sweep
            command: python benchmarks/run_ceiling_sweep.py --seeds 60
            record: ceiling_sweep.jsonl
          - name: hard-instances
            command: python benchmarks/run_hard_instances.py --seeds 60 --traj-seeds 15
            record: hard_instances.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,research,chemistry,bridges]'
      - name: Regenerate
        env:
          RECORD_COMMAND: ${{ matrix.command }}
          RECORD_PATH: ${{ runner.temp }}/${{ matrix.record }}
        run: bash -lc "$RECORD_COMMAND --out '$RECORD_PATH'"
      - name: Compare scientific fields
        run: >-
          python benchmarks/check_regenerated_record.py
          benchmarks/reference_results/${{ matrix.record }}
          ${{ runner.temp }}/${{ matrix.record }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.record }}

  exact-h4-trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,research,chemistry]'
      - run: >-
          python benchmarks/reproduce_exact_h4.py
          --threads 1
          --out ${{ runner.temp }}/h4_exact.jsonl
          --trajectory-out ${{ runner.temp }}/h4_exact_trajectory.json
      - run: >-
          python benchmarks/check_regenerated_record.py
          benchmarks/reference_results/h4_exact_trajectory.json
          ${{ runner.temp }}/h4_exact_trajectory.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-exact-h4
          path: ${{ runner.temp }}/h4_exact*
