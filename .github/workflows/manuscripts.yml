name: manuscripts

# Split out of ci.yml, where the manuscript work was one serial job that ran on
# every pull request. Three things made it the slowest part of the loop:
#
#   1. it ran even when nothing it gates had changed, so experiment commits
#      touching only `molecular_results/` or the molecular pipeline paid for two
#      full REVTeX builds and four record re-runs;
#   2. the PDF builds waited behind a `pip install` of the research and
#      chemistry extras (PySCF, matplotlib) they do not use -- every figure and
#      table is committed, so a build needs TeX and nothing else;
#   3. the record checks, which re-run real computations, waited behind a
#      TeX Live install they do not use either.
#
# So: python work and TeX work are separate jobs that run in parallel, and the
# `paths` allowlist keeps the whole workflow off commits that cannot affect it.
#
# NOTE on branch protection: a workflow skipped by a `paths` filter reports no
# status at all. If any job here is marked as a *required* check, a PR that
# touches none of these paths will wait forever for a status that never
# arrives. Either leave these non-required, or add a always-passing gate job.

# The two path lists are duplicated on purpose: GitHub Actions does not support
# YAML anchors, so `&name`/`*name` would be parsed as literal strings and the
# filter would silently match nothing. Keep the two lists in step.
on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - 'paper_acase/**'
      - 'clifford_qc/**'
      - 'benchmarks/**'
      # These two belong to the molecular experiment, which has its own gate in
      # benchmarks/check_molecular.py and feeds no manuscript. Negations must
      # follow the pattern they subtract from.
      - '!benchmarks/check_molecular.py'
      - '!benchmarks/summarize_molecular.py'
      - 'REPRODUCING.md'
      - 'pyproject.toml'
      - '.github/workflows/manuscripts.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'paper_acase/**'
      - 'clifford_qc/**'
      - 'benchmarks/**'
      - '!benchmarks/check_molecular.py'
      - '!benchmarks/summarize_molecular.py'
      - 'REPRODUCING.md'
      - 'pyproject.toml'
      - '.github/workflows/manuscripts.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not need TeX. This is the job that owns the drift
  # contracts: committed figures, tables, summaries and records must all be
  # reproducible from the code and data beside them.
  records:
    name: records and artifact consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Chemistry extras are not needed to build a manuscript, but they are part
      # of the environment REPRODUCING.md quotes its test count for. Without
      # them three more test files drop out of collection and the count check
      # downgrades itself to a skip -- so the job that owns that contract would
      # never actually enforce it.
      - name: Install (research extras for table stats, chemistry to pin the test count)
        run: python -m pip install -e .[test,research,chemistry] matplotlib

      # The committed figures and tables must be reproducible from the committed
      # records: a regenerated benchmark that leaves a stale asset behind is the
      # defect class these checks exist to catch.
      - name: Paper A -- regenerate figures and tables, then fail on any drift
        run: |
          python paper/make_figures.py
          python paper/make_tables.py
          git diff --exit-code -- paper/tables
      - name: Summaries agree with their records
        run: python benchmarks/check_summaries.py
      - name: REPRODUCING.md agrees with the code
        run: python benchmarks/check_docs.py --require-test-count
      - name: Paper A -- structure (refs, bib keys, table columns, float ages)
        run: python paper/check_manuscript.py

      # paper_acase/ is a second, standalone manuscript with its own generators
      # and its own committed records. It gets the same gates: without them the
      # drift protection above would cover only half the repository's papers.
      - name: A-CASE -- response records agree with a fresh run
        run: python paper_acase/check_response_records.py
      # The warm-start gate keeps every discrete resource and selection field
      # exact while tolerating only cross-BLAS last-bit energy variation.
      - name: A-CASE -- warm-start record agrees with a fresh run
        run: python benchmarks/check_warm_start.py
      # The Krylov widths (Table IV) are checked by value rather than by bytes:
      # the record's raw counts include round-off-level words that two PySCF
      # runs disagree about. See the script's docstring.
      - name: A-CASE -- Krylov widths agree with their record
        run: python benchmarks/check_krylov_width.py
      # The matched contract (Table V) gets the same exact-discrete,
      # tolerant-float gate as the warm-start record: its counts reproduce
      # exactly, its energies carry the optimizer's last bits and so depend on
      # the runner's BLAS.
      - name: A-CASE -- matched-contract record agrees with a fresh run
        run: python benchmarks/check_matched_h4.py
      - name: A-CASE -- regenerate figures and tables, then fail on drift
        run: |
          python paper_acase/make_figures.py
          python paper_acase/make_tables.py
          # Matplotlib PDF streams vary across font/compression builds. The
          # manifest binds every figure to the exact generator and input
          # digests; tables remain directly byte reproducible.
          git diff --exit-code -- \
            paper_acase/paper_assets/manifest.json paper_acase/tables
      - name: A-CASE -- structure (refs, bib keys, table columns, float ages)
        run: python paper_acase/check_manuscript.py

  # The two REVTeX builds. Every figure and table they consume is committed, so
  # these need no Python and no package install -- and they run in parallel with
  # each other and with `records`.
  build:
    name: build ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper: paper
            artifact: manuscript-pdf
          - paper: paper_acase
            artifact: manuscript-acase-pdf
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live (revtex4-2 + the manuscript's packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-publishers texlive-latex-recommended \
            texlive-fonts-recommended texlive-science
      - name: Build the manuscript
        working-directory: ${{ matrix.paper }}
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex
          bibtex manuscript
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex
      # Overfull boxes are text running into the margin. They cost nothing to
      # detect and are invisible in review, so the build gates on zero.
      - name: No overfull boxes, no undefined references or citations
        working-directory: ${{ matrix.paper }}
        run: |
          fail=0
          for pattern in 'Overfull \\hbox' 'LaTeX Warning: Reference' 'LaTeX Warning: Citation'; do
            n=$(grep -c "$pattern" manuscript.log || true)
            echo "$pattern: $n"
            [ "$n" -eq 0 ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo '--- offending lines ---'
            grep -nE 'Overfull \\hbox|LaTeX Warning: (Reference|Citation)' manuscript.log || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paper }}/manuscript.pdf
