name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Sunday 09:17 Asia/Jakarta. Full archival replay is never a new campaign.
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  plan:
    name: select affected record gates
    runs-on: ubuntu-latest
    outputs:
      structural: ${{ steps.gates.outputs.structural }}
      sampled: ${{ steps.gates.outputs.sampled }}
      has_structural: ${{ steps.gates.outputs.has_structural }}
      has_sampled: ${{ steps.gates.outputs.has_sampled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build matrices from the checked registry
        id: gates
        run: python3 -m benchmarks.ci_gates --plan --event "$GITHUB_EVENT_NAME" --event-file "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  test:
    name: tests, lint, and the short record gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI_JOB_TIMEOUT_SECONDS: "2400"
      # This is the record environment: a full clone under the pinned stack.
      # A test that would skip for want of either is a failure here, so the
      # environment preconditions other jobs skip cannot go quiet in this one.
      CLIFFORD_QC_STRICT_TEST_ENVIRONMENT: "1"
    steps:
      - name: Start job wall-time budget
        run: echo "CI_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/record-environment
        with:
          reference-record: protocol_cost.json
      - run: ruff check clifford_qc molecular tests benchmarks
      - run: python -m mypy
      - run: python -m pytest --hypothesis-profile=ci
      - name: Run every core gate and retain all failures
        if: ${{ !cancelled() }}
        run: python -m benchmarks.ci_gates --tier core --output .ci-receipts/core
      - name: Retain execution receipts and verified logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-receipts
          path: .ci-receipts/core
          retention-days: 14
          include-hidden-files: true

  # The record environment above is one interpreter and one pinned stack. The
  # package advertises more than that, and nothing else in this workflow would
  # notice a release that breaks under another supported Python or without an
  # optional extra. These jobs install current dependencies, so they also see a
  # new NumPy or SciPy before a record environment is migrated to it.
  compatibility:
    name: tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Every version in pyproject's classifiers except the record
        # environment's, which the job above covers. Held together by
        # tests/test_ci_gates.py.
        python: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,research,stim]'
      # State the extras this job expects, so a failed install cannot turn
      # into a suite that skips its way to green.
      - run: python -m clifford_qc.capabilities --require sparse_linalg --require stabilizer_backend
      - run: python -m pytest --hypothesis-profile=ci

  extras:
    name: tests with ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # NumPy is the only core dependency: the suite must collect and pass,
          # skipping what needs an extra, with nothing else installed.
          - name: NumPy only
            extras: test
            require: ""
          # The bridge and chemistry tests skip everywhere else.
          - name: every bridge and chemistry extra
            extras: test,research,bridges,chemistry
            require: >-
              --require sparse_linalg --require stabilizer_backend
              --require openfermion_bridge --require pytket_bridge
              --require pennylane_bridge --require pyzx_bridge
              --require molecular_input
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[${{ matrix.extras }}]'
      - run: python -m clifford_qc.capabilities ${{ matrix.require }}
      - run: python -m pytest --hypothesis-profile=ci

  structural-records:
    needs: plan
    if: needs.plan.outputs.has_structural == 'true'
    name: ${{ matrix.gate }} (structural)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CI_JOB_TIMEOUT_SECONDS: ${{ matrix.job_timeout_seconds }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.structural) }}
    steps:
      - name: Start job wall-time budget
        run: echo "CI_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/record-environment
        with:
          reference-record: ${{ matrix.environment_record }}
          execution-declaration: ${{ matrix.execution_declaration }}
      - run: python -m benchmarks.ci_gates --gate "${{ matrix.gate }}" --output ".ci-receipts/${{ matrix.gate }}"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: receipts-${{ matrix.gate }}
          path: .ci-receipts/${{ matrix.gate }}
          retention-days: 14
          include-hidden-files: true

  sampled-records:
    needs: plan
    if: needs.plan.outputs.has_sampled == 'true'
    name: ${{ matrix.gate }} (${{ matrix.verification_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CI_JOB_TIMEOUT_SECONDS: ${{ matrix.job_timeout_seconds }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.sampled) }}
    steps:
      - name: Start job wall-time budget
        run: echo "CI_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/record-environment
        with:
          reference-record: ${{ matrix.environment_record }}
          execution-declaration: ${{ matrix.execution_declaration }}
      - run: python -m benchmarks.ci_gates --gate "${{ matrix.gate }}" --output ".ci-receipts/${{ matrix.gate }}"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: receipts-${{ matrix.gate }}
          path: .ci-receipts/${{ matrix.gate }}
          retention-days: 14
          include-hidden-files: true
