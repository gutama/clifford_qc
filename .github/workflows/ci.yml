name: CI

# Cheap deterministic checks protect every pull request and main update.
# Sampled record rebuilds stay available by explicit dispatch because the full
# matrix costs roughly ten runner-hours. See REPRODUCING.md for the merge rule.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every record here is a float compared against a committed float, and threaded
# BLAS reductions sum in an order that depends on the thread count: the same
# `eigvalsh` call returns four different last bits across OMP_NUM_THREADS 1..4,
# deterministically within each. Pinning one thread removes that degree of
# freedom from every job at once. It does not make the records portable across
# CPU microarchitectures -- OpenBLAS also picks kernels by instruction set, and
# `REPRODUCING.md` records the floor that leaves -- but it is the one source a
# workflow can close, and it costs nothing here: the eigensolves are on small
# projected pencils, and the expensive gates are shot-sampling bound.
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  test:
    name: tests, lint, and the short record gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/record-environment
        with:
          reference-record: protocol_cost.json

      - run: ruff check clifford_qc tests benchmarks
      - run: python -m pytest --hypothesis-profile=ci

      # One step per gate so the Actions view names the failure, and each runs
      # even after an earlier one fails: a drift suite that stops at the first
      # mismatch reports one symptom of what is usually a shared cause.
      - name: documentation drift
        if: ${{ !cancelled() }}
        run: python benchmarks/check_docs.py
      - name: molecular records
        if: ${{ !cancelled() }}
        run: python benchmarks/check_molecular.py
      - name: Krylov width
        if: ${{ !cancelled() }}
        run: python benchmarks/check_krylov_width.py
      - name: Clifford measurement hierarchy
        if: ${{ !cancelled() }}
        run: python benchmarks/check_clifford_hierarchy.py
      - name: finite-shot optimization
        if: ${{ !cancelled() }}
        run: python benchmarks/check_finite_shot_optimization.py
      - name: warm start
        if: ${{ !cancelled() }}
        run: python benchmarks/check_warm_start.py

  structural-records:
    name: ${{ matrix.gate }} (structural)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: check_mapping_axis
            timeout: 20
            environment_record: mapping_axis.json
          - gate: check_protocol_axis
            timeout: 20
            environment_record: protocol_axis.json
          - gate: check_priceability_screen
            timeout: 10
            environment_record: priceability_screen.json
          - gate: check_r3_environment_migration
            timeout: 10
            environment_record: priceability_screen.json
          - gate: check_r3b_preregistration
            timeout: 10
            environment_record: priceability_screen.json
          - gate: check_r3c_preregistration
            timeout: 10
            environment_record: r3b_margin_stop_probe.json
          - gate: check_r3d_preregistration
            timeout: 10
            environment_record: r3c_lih_full_cost.json
          - gate: check_phase14b_preregistration
            timeout: 10
            environment_record: protocol_axis.json
          - gate: check_r4a_preregistration
            timeout: 10
            environment_record: priceability_screen.json
          - gate: check_r4a_contextual_screen
            timeout: 20
            environment_record: r4a_contextual_screen.json
          - gate: check_g1_structural_preconditioner
            timeout: 15
            environment_record: g1_structural_preconditioner.json
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/record-environment
        with:
          reference-record: ${{ matrix.environment_record }}
      - run: python benchmarks/${{ matrix.gate }}.py

  environment-consistency:
    # Keep the cross-record contract visible without preventing record-local
    # gates from naming exactly which evidence needs an environment migration.
    if: github.event_name == 'workflow_dispatch'
    name: all records agree on one environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 benchmarks/check_record_environment.py

  sampled-records:
    # These gates draw replicas or rebuild records from sampled evidence. Run
    # them against the exact branch head before merging and name that dispatch
    # run in the PR. They never run implicitly on a pull request or main push.
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.gate }} (sampled, manual)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: check_r3b_margin_stop_probe
            timeout: 30
            environment_record: r3b_margin_stop_probe.json
          - gate: check_finite_shot_rethink
            timeout: 20
            environment_record: finite_shot_rethink.json
          - gate: check_matched_h4
            timeout: 30
            environment_record: matched_h4.json
          - gate: check_qr3b_instance_preflight
            timeout: 150
            environment_record: qr3b_instance_preflight.json
          - gate: check_exact_shot_search
            timeout: 120
            environment_record: exact_shot_search.json
          - gate: check_protocol_cost
            timeout: 210
            environment_record: protocol_cost.json
          # The one authorized R3c execution, rebuilt and compared. About 26
          # minutes on four local workers; the ceiling is set for a slower
          # runner rather than from that measurement.
          - gate: check_r3c_lih_full_cost
            timeout: 180
            environment_record: r3c_lih_full_cost.json
          # R3d draws seven targeted within-grid endpoint cells rather than
          # replaying the full R3c grid. Keep it manual because it still
          # executes the frozen 30+100 sampled instrument end to end.
          - gate: check_r3d_qr3_refinement
            timeout: 120
            environment_record: r3d_qr3_refinement.json
          - gate: check_phase14b_qwc_vs_fc
            timeout: 30
            environment_record: phase14b_qwc_vs_fc.json
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/record-environment
        with:
          reference-record: ${{ matrix.environment_record }}
      - run: python benchmarks/${{ matrix.gate }}.py
