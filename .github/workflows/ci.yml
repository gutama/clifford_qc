name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Iterating on experiments means pushing to the same branch repeatedly. Without
# this, every push starts a full run and they queue behind one another when only
# the newest result is ever wanted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .[test]
      - name: Run tests (core, bridge tests skip without extras)
        run: python -m pytest
      - name: Verification entry point
        run: python -m clifford_qc.verify

  # The molecular experiment's own gate. It lives here rather than in
  # manuscripts.yml because molecular_results/ feeds no manuscript and is
  # explicitly subtracted from that workflow's path filter -- which had the
  # effect that the gate appeared in CI only as a negated path and never
  # actually ran. Both scripts are pure standard library, so this job needs no
  # install and costs seconds.
  molecular:
    name: molecular records and report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Records are internally consistent
        run: python benchmarks/check_molecular.py
      # The report is generated from the record, so a regenerated record that
      # leaves a stale report behind is the same drift class the paper gates
      # catch. The PDF is not checked here: it needs TeX, and binding it to its
      # source is a separate open item.
      - name: Report agrees with the record it is generated from
        run: |
          python benchmarks/summarize_molecular.py
          git diff --exit-code -- \
            molecular_simulation_report.md molecular_simulation_report.tex

  bridges:
    name: bridges (stim, openfermion, pytket, pennylane, pyzx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with all bridge extras
        run: python -m pip install -e .[test,bridges]
      - name: Run full suite
        run: python -m pytest
