name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Sunday 09:17 Asia/Jakarta. Full archival replay is never a new campaign.
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  plan:
    name: select affected record gates
    runs-on: ubuntu-latest
    outputs:
      structural: ${{ steps.gates.outputs.structural }}
      sampled: ${{ steps.gates.outputs.sampled }}
      has_structural: ${{ steps.gates.outputs.has_structural }}
      has_sampled: ${{ steps.gates.outputs.has_sampled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build matrices from the checked registry
        id: gates
        run: python3 -m benchmarks.ci_gates --plan --event "$GITHUB_EVENT_NAME" --event-file "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  test:
    name: tests, lint, and the short record gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/record-environment
        with:
          reference-record: protocol_cost.json
      - run: ruff check clifford_qc molecular tests benchmarks
      - run: python -m pytest --hypothesis-profile=ci
      - name: Run every core gate and retain all failures
        if: ${{ !cancelled() }}
        run: python -m benchmarks.ci_gates --tier core --output .ci-receipts/core
      - name: Retain execution receipts and verified logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-receipts
          path: .ci-receipts/core
          retention-days: 14
          include-hidden-files: true

  structural-records:
    needs: plan
    if: needs.plan.outputs.has_structural == 'true'
    name: ${{ matrix.gate }} (structural)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.structural) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/record-environment
        with:
          reference-record: ${{ matrix.environment_record }}
          execution-declaration: ${{ matrix.execution_declaration }}
      - run: python -m benchmarks.ci_gates --gate "${{ matrix.gate }}" --output ".ci-receipts/${{ matrix.gate }}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: receipts-${{ matrix.gate }}
          path: .ci-receipts/${{ matrix.gate }}
          retention-days: 14
          include-hidden-files: true

  sampled-records:
    needs: plan
    if: needs.plan.outputs.has_sampled == 'true'
    name: ${{ matrix.gate }} (sampled replay)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.sampled) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/record-environment
        with:
          reference-record: ${{ matrix.environment_record }}
          execution-declaration: ${{ matrix.execution_declaration }}
      - run: python -m benchmarks.ci_gates --gate "${{ matrix.gate }}" --output ".ci-receipts/${{ matrix.gate }}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: receipts-${{ matrix.gate }}
          path: .ci-receipts/${{ matrix.gate }}
          retention-days: 14
          include-hidden-files: true

  environment-consistency:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    name: all records agree on one environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m benchmarks.ci_gates --gate check_record_environment --output .ci-receipts/environment
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: environment-receipts
          path: .ci-receipts/environment
          retention-days: 14
          include-hidden-files: true
