name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Iterating on experiments means pushing to the same branch repeatedly. Without
# this, every push starts a full run and they queue behind one another when only
# the newest result is ever wanted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .[test]
      - name: Run tests (core, bridge tests skip without extras)
        run: python -m pytest
      - name: Verification entry point
        run: python -m clifford_qc.verify

  bridges:
    name: bridges (stim, openfermion, pytket, pennylane, pyzx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with all bridge extras
        run: python -m pip install -e .[test,bridges]
      - name: Run full suite
        run: python -m pytest
